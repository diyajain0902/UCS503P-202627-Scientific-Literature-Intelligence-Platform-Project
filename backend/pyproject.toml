[project]
name = "slip-backend"
version = "0.1.0"
description = "Scientific Literature Intelligence Platform — backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.25",
    "python-multipart>=0.0.20",
    "sentence-transformers>=3.3",
    "sqlalchemy>=2.0.36",
    "torch>=2.5",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]

[tool.ruff.lint.isort]
# backend/alembic/ holds migrations; the import name refers to the Alembic library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# PyMuPDF ships partial type hints; allow calls into it without weakening strictness elsewhere.
untyped_calls_exclude = ["pymupdf"]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires PostgreSQL + pgvector (SLIP_TEST_DATABASE_URL)",
    "model: loads the real embedding model (downloads it on first use)",
    "network: calls the live arXiv API",
    "ollama: calls the real local Ollama model (not run in CI)",
    "e2e: HTTP tests against a running stack (SLIP_E2E_BASE_URL; not run in CI)",
]

[tool.uv]
# OneDrive-synced folders reject hardlinks from the uv cache.
link-mode = "copy"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
