name: CI

on:
  # Every branch push runs CI; pull requests show the result for their head commit.
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration and not model and not network and not ollama"

  backend-integration:
    # Real PostgreSQL + pgvector and the real MiniLM model. Live arXiv tests (marker `network`) are manual.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: slip
          POSTGRES_PASSWORD: slip
          POSTGRES_DB: slip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slip -d slip_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SLIP_TEST_DATABASE_URL: postgresql+psycopg://slip:slip@127.0.0.1:5432/slip_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - run: uv sync --locked
      - run: uv run pytest -m "integration or model" -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-images:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

  retrieval-eval:
    # FR-21 regression gate: real corpus (fetched from arXiv), real MiniLM, real pgvector.
    # Threshold rationale: docs/evaluation.md section 5.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: slip
          POSTGRES_PASSWORD: slip
          POSTGRES_DB: slip_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slip -d slip_eval"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SLIP_DATABASE_URL: postgresql+psycopg://slip:slip@127.0.0.1:5432/slip_eval
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run python -m app.evaluation build-corpus
      - run: uv run python -m app.evaluation check-labels
      - run: uv run python -m app.evaluation retrieval --min-recall-at-5 0.675 --no-record
